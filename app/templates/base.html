<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ party_name }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/htmx.min.js"></script>
</head>
<body>
  {% if current_person is defined %}
  <header class="topbar">
    <div class="brand">{{ party_name }}</div>
    <nav class="main-nav">
      <a href="/">Dashboard</a>
      <a href="/calendar">Calendar</a>
      <a href="/games">Games</a>
      <a href="/inventory">Inventory</a>
    </nav>
    <div class="whoami">
      {% if current_person %}
        <span class="dot" style="background: {{ current_person.color }}"></span>
        <span>{{ current_person.name }}</span>
        <a href="/select-person">switch</a>
        <a href="/logout">logout</a>
      {% else %}
        <a href="/select-person">pick a name</a>
      {% endif %}
    </div>
  </header>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
