{% extends "base.html" %}
{% block content %}
<div class="login-wrap card">
  <h1>Who are you?</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/select-person">
    {% if people %}
      <label>Pick your name
        <select name="person_id">
          <option value="">-- select --</option>
          {% for person in people %}
            <option value="{{ person.id }}">{{ person.name }}</option>
          {% endfor %}
        </select>
      </label>
    {% endif %}
    <p class="muted small">or type a new name below to add yourself</p>
    <label>New name
      <input type="text" name="new_name" placeholder="e.g. Alex">
    </label>
    <br>
    <button type="submit">Continue</button>
  </form>
</div>
{% endblock %}
